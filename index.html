<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA 2K Admin Web Audit</title>
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/7/7a/Basketball.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind CSS Configuration for NBA 2K Branding
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        montserrat: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        'nba-blue': '#051A3A',
                        'nba-red': '#EA1F27',
                        'nba-pink': '#DD3894',
                        'nba-yellow': '#FFA436',
                        'nba-teal': '#16F2D2',
                        'nba-white': '#FFFFFF',
                        'nba-gray-light': '#f3f4f6',
                        'nba-gray-medium': '#e5e7eb',
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            background-color: #051A3A;
            color: #FFFFFF;
        }
        iframe {
            width: 100%;
            /* Only one tool now, so there's no tab bar eating into the height budget. */
            height: calc(100vh - 120px);
            border: 1px solid #051A3A;
            background-color: #FFFFFF;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-8">
    <div class="bg-nba-blue shadow-2xl rounded-2xl p-6 sm:p-8 md:p-10 border-4 border-nba-red">
        <header class="flex items-center gap-4 mb-6">
            <img src="https://raw.githubusercontent.com/nin884/AdminWebTools/main/nba2k.png" alt="NBA 2K Logo" class="h-12 sm:h-16">
            <h1 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-nba-white tracking-tight">NBA 2K Admin Web Audit</h1>
        </header>

        <iframe id="toolFrame" src="AdminAudit.html" title="Admin Web Audit"></iframe>
    </div>
</body>
</html>
